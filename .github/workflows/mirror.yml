# This is a workflow to mirror repo to chookspace

name: Chookspace Mirror

# Controls when the workflow will run
on:
  # Triggers the workflow on push
  push:
    branches: ["**"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "mirror"
  mirror:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Push mirror
        env: 
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git remote add mirror https://username:$TOKEN@chookspace.com/reallynniroprobably/iodine.git
          git push --mirror mirror
